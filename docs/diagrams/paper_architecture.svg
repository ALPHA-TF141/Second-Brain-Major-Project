<svg xmlns="http://www.w3.org/2000/svg" width="360" height="222" viewBox="0 0 360 222" font-family="Libertinus Serif, serif">
  <!-- ================= left: main pipeline ================= -->
  <rect x="6" y="6" width="160" height="32" fill="#f2f2f2" stroke="#333" stroke-width="0.8"/>
  <text x="86" y="19" text-anchor="middle" font-size="9.5">Capture &amp; ingest</text>
  <text x="86" y="31" text-anchor="middle" font-size="7">screen OCR · mail · web · voice · clipboard</text>
  <line x1="86" y1="38" x2="86" y2="45" stroke="#333" stroke-width="0.8"/>
  <polygon points="86,50 83,44.5 89,44.5" fill="#333"/>

  <rect x="6" y="50" width="160" height="32" fill="#f2f2f2" stroke="#333" stroke-width="0.8"/>
  <text x="86" y="63" text-anchor="middle" font-size="9.5">Normalisation</text>
  <text x="86" y="75" text-anchor="middle" font-size="7">chunking · content hash · dedup key</text>
  <line x1="86" y1="82" x2="86" y2="89" stroke="#333" stroke-width="0.8"/>
  <polygon points="86,94 83,88.5 89,88.5" fill="#333"/>

  <rect x="6" y="94" width="160" height="32" fill="#f2f2f2" stroke="#333" stroke-width="0.8"/>
  <text x="86" y="107" text-anchor="middle" font-size="9.5">Memory store</text>
  <text x="86" y="119" text-anchor="middle" font-size="7">SQLite · FTS index · vectors · derived graph</text>
  <line x1="86" y1="126" x2="86" y2="133" stroke="#333" stroke-width="0.8"/>
  <polygon points="86,138 83,132.5 89,132.5" fill="#333"/>

  <rect x="6" y="138" width="160" height="32" fill="#e6e6e6" stroke="#333" stroke-width="1.1"/>
  <text x="86" y="151" text-anchor="middle" font-size="9.5" font-weight="bold">Retrieval</text>
  <text x="86" y="163" text-anchor="middle" font-size="7">vanilla · hybrid · graph · adaptive</text>
  <line x1="86" y1="170" x2="86" y2="177" stroke="#333" stroke-width="0.8"/>
  <polygon points="86,182 83,176.5 89,176.5" fill="#333"/>

  <rect x="6" y="182" width="160" height="32" fill="#f2f2f2" stroke="#333" stroke-width="0.8"/>
  <text x="86" y="195" text-anchor="middle" font-size="9.5">Generation</text>
  <text x="86" y="207" text-anchor="middle" font-size="7">local / hosted LLM over ranked context</text>

  <!-- ================= right: research layer ================= -->
  <rect x="196" y="6" width="158" height="154" fill="none" stroke="#333" stroke-width="0.9" stroke-dasharray="4 2.5"/>
  <text x="275" y="19" text-anchor="middle" font-size="8.5" font-style="italic">Research layer (additive, switchable)</text>

  <rect x="204" y="25" width="142" height="19" fill="#ffffff" stroke="#555" stroke-width="0.6"/>
  <text x="275" y="37.5" text-anchor="middle" font-size="7.8">C1  Adaptive scoring · 8 terms</text>
  <rect x="204" y="47" width="142" height="19" fill="#ffffff" stroke="#555" stroke-width="0.6"/>
  <text x="275" y="59.5" text-anchor="middle" font-size="7.8">C2  Temporal TKG · supersession</text>
  <rect x="204" y="69" width="142" height="19" fill="#ffffff" stroke="#555" stroke-width="0.6"/>
  <text x="275" y="81.5" text-anchor="middle" font-size="7.8">C3  NLI conflicts · rank damping</text>
  <rect x="204" y="91" width="142" height="19" fill="#ffffff" stroke="#555" stroke-width="0.6"/>
  <text x="275" y="103.5" text-anchor="middle" font-size="7.8">C4  Consolidation · provenance</text>
  <rect x="204" y="113" width="142" height="19" fill="#ffffff" stroke="#555" stroke-width="0.6"/>
  <text x="275" y="125.5" text-anchor="middle" font-size="7.8">C5  Knowledge-gap detection</text>
  <rect x="204" y="135" width="142" height="19" fill="#ffffff" stroke="#555" stroke-width="0.6"/>
  <text x="275" y="147.5" text-anchor="middle" font-size="7.8">C6  Forgetting · 5 surfaces</text>

  <!-- C7 bench -->
  <rect x="196" y="182" width="158" height="32" fill="#ffffff" stroke="#333" stroke-width="0.9"/>
  <text x="275" y="195" text-anchor="middle" font-size="8.8">C7  PersonalBrain-Bench</text>
  <text x="275" y="207" text-anchor="middle" font-size="7">evaluates the four pipelines (Tables III–VIII)</text>

  <!-- store <-> research layer -->
  <line x1="166" y1="104" x2="190" y2="104" stroke="#333" stroke-width="0.8"/>
  <polygon points="196,104 190,101 190,107" fill="#333"/>
  <text x="181" y="100" text-anchor="middle" font-size="6.2">annotate</text>
  <line x1="196" y1="116" x2="172" y2="116" stroke="#333" stroke-width="0.8"/>
  <polygon points="166,116 172,113 172,119" fill="#333"/>
  <text x="181" y="126" text-anchor="middle" font-size="6.2">scores</text>

  <!-- research layer -> retrieval : gating (elbow) -->
  <path d="M 210 160 L 210 178 L 176 178 L 176 154 L 172 154" fill="none" stroke="#333" stroke-width="0.8"/>
  <polygon points="166,154 172,151 172,157" fill="#333"/>
  <text x="262" y="174" text-anchor="middle" font-size="6.2">exclude · damp · dedup</text>

  <!-- C7 -> retrieval : measurement (dashed elbow) -->
  <path d="M 196 198 L 172 198 L 172 162 L 170 162" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="2.5 2"/>
  <polygon points="166,162 171,159 171,165" fill="#333"/>
  <text x="181" y="208" text-anchor="middle" font-size="6.2">measures</text>
</svg>
